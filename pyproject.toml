[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videoorganizer"
version = "0.1.0"
description = "Organize, semantically tag, browse, and cut recap videos from a shared pile of photos and video clips."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan Eaton" }]
keywords = ["photos", "video", "exif", "sqlite", "fts5", "ollama", "ffmpeg", "recap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "Pillow>=10.0",
    "pillow-heif>=0.13",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
web = ["Flask>=3.0"]
drive = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
    "google-auth>=2.23",
]
dev = ["pytest>=7.4"]
all = [
    "videoorganizer[web]",
    "videoorganizer[drive]",
]

[project.urls]
Homepage = "https://github.com/R2bEEaton/VideoOrganizer"
Issues = "https://github.com/R2bEEaton/VideoOrganizer/issues"

[project.scripts]
vorg = "videoorganizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/videoorganizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
